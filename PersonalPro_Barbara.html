<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#0b0d12"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Personal Pro"/>
<title>💪 Personal Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0d12;--card:#12151d;--cardB:#181c28;--border:#1e2333;
  --accent:#00e5a0;--accentBg:rgba(0,229,160,.07);
  --text:#e8eaf2;--sub:#9ca3b0;--muted:#555f7a;
  --danger:#ff4d6d;--warn:#f59e0b;--blue:#3b82f6;--purple:#a855f7;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
#nav{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:2px;padding:0 12px;height:56px}
.nav-logo{display:flex;align-items:center;gap:7px;margin-right:8px;flex-shrink:0}
.nav-logo-ico{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#00e5a0,#00b87d);
  display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-logo-name{font-weight:900;font-size:13px;letter-spacing:-.02em}
.nav-btn{background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 9px;
  color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;gap:3px;transition:all .15s}
.nav-btn.active{background:var(--accentBg);border-color:rgba(0,229,160,.3);color:var(--accent)}
#app{max-width:860px;margin:0 auto;padding:18px 13px 60px}
.page{display:none}.page.active{display:block}
.sgrid{display:grid;grid-template_columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:15px;position:relative}
.sc-val{font-size:22px;font-weight:900;color:var(--accent)}
.sc-lbl{font-size:11px;color:var(--muted);margin-top:3px}
.acard{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
.bp{background:var(--accent);color:#0b0d12}
.bg{background:transparent;color:var(--muted);border:1px solid var(--border)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase}
.fld input, .fld select {background:#090b10;border:1px solid var(--border);border-radius:7px;padding:9px 11px;color:var(--text);width:100%}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:200;align-items:center;justify-content:center;padding:13px}
#ov.open{display:flex}
.mbox{background:var(--card);border:1px solid #252b3d;border-radius:17px;width:100%;max-width:500px;padding:22px}
</style>
</head>
<body>
<div id="nav">
  <div class="nav-logo"><div class="nav-logo-ico">💪</div><div class="nav-logo-name">Personal Pro</div></div>
  <button class="nav-btn active" onclick="ir('dashboard')" id="nb-dashboard">📊 Dashboard</button>
  <button class="nav-btn" onclick="ir('alunos')" id="nb-alunos">👥 Alunos</button>
</div>
<div id="app">
  <div class="page active" id="page-dashboard">
    <h2 style="margin-bottom:15px">Olá, Bárbara! 👋</h2>
    <div id="stats" style="display:flex; gap:10px;"></div>
  </div>
  <div class="page" id="page-alunos">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
      <h3>Seus Alunos</h3>
      <button class="btn bp" onclick="abrirForm()">+ Novo Aluno</button>
    </div>
    <div id="lista-alunos"></div>
  </div>
</div>
<div id="ov" onclick="if(event.target==this)fecharModal()">
  <div class="mbox">
    <h2 id="m-title" style="margin-bottom:15px"></h2>
    <div id="m-body"></div>
  </div>
</div>
<script>
let S = { alunos: [], pagina: 'dashboard' };
function salvar(){ localStorage.setItem('pp_data_v2', JSON.stringify(S)); }
function carregar(){ 
  const d = localStorage.getItem('pp_data_v2'); 
  if(d) S = JSON.parse(d); 
}
function ir(p){
  S.pagina = p;
  document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.getElementById('nb-'+p).classList.add('active');
  render();
}
function abrirForm(){
  document.getElementById('m-title').textContent = "Novo Aluno";
  document.getElementById('m-body').innerHTML = `
    <div class="fld"><label>Nome</label><input id="f-nome"></div>
    <div class="fld"><label>Plano</label><select id="f-plano">
      <option>Mensal – 2x/semana</option><option>Mensal – 3x/semana</option><option>Online</option>
    </select></div>
    <button class="btn bp" onclick="salvarAluno()">Salvar</button>
  `;
  document.getElementById('ov').classList.add('open');
}
function salvarAluno(){
  const nome = document.getElementById('f-nome').value;
  if(!nome) return;
  S.alunos.push({id:Date.now(), nome, plano:document.getElementById('f-plano').value});
  salvar(); fecharModal(); render();
}
function fecharModal(){ document.getElementById('ov').classList.remove('open'); }
function render(){
  if(S.pagina==='dashboard'){
    document.getElementById('stats').innerHTML = \`<div class="sc"><div class="sc-val">\${S.alunos.length}</div><div class="sc-lbl">Alunos Ativos</div></div>\`;
  }
  if(S.pagina==='alunos'){
    const lista = document.getElementById('lista-alunos');
    if(S.alunos.length === 0) {
      lista.innerHTML = '<p style="color:gray; padding:20px; text-align:center;">Nenhum aluno cadastrado.</p>';
    } else {
      lista.innerHTML = S.alunos.map(a=>\`
        <div class="acard">
          <div style="flex:1"><strong>\${a.nome}</strong><br><small style="color:var(--sub)">\${a.plano}</small></div>
          <button class="btn bg" onclick="excluir(\${a.id})">Remover</button>
        </div>\`).join('');
    }
  }
}
function excluir(id){
  if(confirm('Remover aluno?')){ S.alunos=S.alunos.filter(a=>a.id!==id); salvar(); render(); }
}
window.onload = () => { carregar(); render(); };
</script>
</body>
</html>
